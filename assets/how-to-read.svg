<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="How to read a Chimni program: right means depends on, down means independent, a quote mark reads the cell above">
<title>How to read a Chimni program</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#161e3d"/></linearGradient>
<linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/></pattern>
</defs>
<rect width="1100" height="640" rx="18" fill="url(#bg)"/><rect width="1100" height="640" rx="18" fill="url(#dots)"/>
<text x="50" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="4" fill="#8b93b5" font-weight="600">HOW TO READ A CHIMNI PROGRAM</text>
<text x="50" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" fill="#e6e9f5" font-weight="700">$[sales]{(cat,share)}</text>
<text x="360" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8b93b5">← one input, one output: a list of (category, share) pairs</text>
<text x="205.0" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7599">column 1</text>
<text x="435.0" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7599">column 2</text>
<text x="665.0" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7599">column 3</text>
<text x="895.0" y="150" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6b7599">column 4</text>
<circle cx="68" cy="196.0" r="15" fill="none" stroke="#56608a" stroke-width="1.5"/><text x="68" y="201.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b93b5">1</text>
<circle cx="68" cy="311.0" r="15" fill="none" stroke="#56608a" stroke-width="1.5"/><text x="68" y="316.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b93b5">2</text>
<circle cx="68" cy="426.0" r="15" fill="none" stroke="#56608a" stroke-width="1.5"/><text x="68" y="431.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b93b5">3</text>
<g ><rect x="120" y="170" width="170" height="52" rx="10" fill="#3ddbd9" fill-opacity="0.1" stroke="#3ddbd9" stroke-width="1.6" /><text x="205.0" y="202.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">@sales</text></g>
<line x1="293" y1="196.0" x2="339" y2="196.0" stroke="#56608a" stroke-width="2"/><path d="M346,196.0 L337,191.0 L337,201.0 Z" fill="#56608a"/>
<g ><rect x="350" y="170" width="170" height="52" rx="10" fill="#9b87f5" fill-opacity="0.1" stroke="#9b87f5" stroke-width="1.6" /><text x="435.0" y="202.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">#(cat)</text></g>
<line x1="523" y1="196.0" x2="569" y2="196.0" stroke="#56608a" stroke-width="2"/><path d="M576,196.0 L567,191.0 L567,201.0 Z" fill="#56608a"/>
<g ><rect x="580" y="170" width="170" height="52" rx="10" fill="#9b87f5" fill-opacity="0.1" stroke="#9b87f5" stroke-width="1.6" /><text x="665.0" y="202.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">+s(amount)</text></g>
<g ><rect x="120" y="285" width="170" height="52" rx="10" fill="#3ddbd9" fill-opacity="0.1" stroke="#3ddbd9" stroke-width="1.6" /><text x="205.0" y="317.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">@sales</text></g>
<line x1="293" y1="311.0" x2="339" y2="311.0" stroke="#56608a" stroke-width="2"/><path d="M346,311.0 L337,306.0 L337,316.0 Z" fill="#56608a"/>
<g ><rect x="350" y="285" width="170" height="52" rx="10" fill="#4b5578" fill-opacity="0.06" stroke="#4b5578" stroke-width="1.6" stroke-dasharray="4 4"/><text x="435.0" y="317.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#6b7599" font-weight="600">.</text></g>
<line x1="523" y1="311.0" x2="569" y2="311.0" stroke="#56608a" stroke-width="2"/><path d="M576,311.0 L567,306.0 L567,316.0 Z" fill="#56608a"/>
<g ><rect x="580" y="285" width="170" height="52" rx="10" fill="#9b87f5" fill-opacity="0.1" stroke="#9b87f5" stroke-width="1.6" /><text x="665.0" y="317.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">+s(amount)</text></g>
<g ><rect x="120" y="400" width="170" height="52" rx="10" fill="#4b5578" fill-opacity="0.06" stroke="#4b5578" stroke-width="1.6" stroke-dasharray="4 4"/><text x="205.0" y="432.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#6b7599" font-weight="600">.</text></g>
<line x1="293" y1="426.0" x2="339" y2="426.0" stroke="#3a4468" stroke-width="2"/><path d="M346,426.0 L337,421.0 L337,431.0 Z" fill="#3a4468"/>
<g ><rect x="350" y="400" width="170" height="52" rx="10" fill="#4b5578" fill-opacity="0.06" stroke="#4b5578" stroke-width="1.6" stroke-dasharray="4 4"/><text x="435.0" y="432.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#6b7599" font-weight="600">.</text></g>
<g ><rect x="580" y="400" width="170" height="52" rx="10" fill="#ff6b9d" fill-opacity="0.1" stroke="#ff6b9d" stroke-width="1.6" /><text x="665.0" y="432.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">''/'</text></g>
<line x1="753" y1="426.0" x2="799" y2="426.0" stroke="#56608a" stroke-width="2"/><path d="M806,426.0 L797,421.0 L797,431.0 Z" fill="#56608a"/>
<g ><rect x="810" y="400" width="170" height="52" rx="10" fill="#6ee7a0" fill-opacity="0.1" stroke="#6ee7a0" stroke-width="1.6" /><text x="895.0" y="432.3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#e6e9f5" font-weight="600">^</text></g>
<path d="M665,397 V345" stroke="#ff6b9d" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M665,340 l-5,9 h10 z" fill="#ff6b9d"/>
<path d="M720,397 V370 H785 V196.0 H755" stroke="#ff6b9d" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M753,196.0 l9,-5 v10 z" fill="#ff6b9d"/>
<text x="795" y="316.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#ff6b9d">'' = 2 rows up</text>
<text x="672" y="361" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#ff6b9d" dx="10">' = 1 row up</text>
<text x="895.0" y="478" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6ee7a0">emits into (cat, share)</text>
<text x="120" y="478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6b7599">row 3 divides row 1 by row 2 — no variable names needed</text>
<text x="50" y="565" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="30" fill="#8b93b5" font-weight="700">→</text>
<text x="90" y="559" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e6e9f5" font-weight="600">Right: consumes the cell on its left</text>
<text x="90" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b93b5">A cell’s only input is its neighbour.</text>
<text x="395" y="565" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="30" fill="#3ddbd9" font-weight="700">↓</text>
<text x="435" y="559" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e6e9f5" font-weight="600">Down: a new, independent row</text>
<text x="435" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b93b5">Rows share nothing, so they can run in parallel.</text>
<text x="740" y="565" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="30" fill="#ff6b9d" font-weight="700">''</text>
<text x="780" y="559" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e6e9f5" font-weight="600">Quote: read the cell above</text>
<text x="780" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b93b5">Same column, N rows up. This is how rows join.</text>
</svg>