name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Install pandas (for the fair-comparison tests; jq ships with the runner)
        run: python -m pip install pandas
      - name: Unit and differential tests
        run: python -m unittest discover -s tests -v
      - name: Every example is well-formed
        run: |
          for f in examples/*.chimni; do chimni "$f"; done
      - name: Size benchmark runs
        run: python benchmarks/size.py
      - name: Site builds
        run: python site/build.py

  llm-benchmark-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . PyYAML tiktoken pandas
      - name: Benchmark self-tests (references agree, few-shots correct, mock pipeline end to end)
        run: python -m unittest discover -s benchmarks/llm/tests -t . -v
