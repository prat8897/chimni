<text x="64" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="4" fill="#8b93b5" font-weight="600">A 2D DATAFLOW LANGUAGE</text>
<text x="60" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="96" font-weight="800" fill="url(#word)">chimni</text>
<text x="64" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#e6e9f5" font-weight="600">Layout is grammar.</text>
<text x="64" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8b93b5">Right means “depends on”. Down means “independent”.</text>
<text x="64" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8b93b5">Inputs and outputs live in the syntax.</text>
