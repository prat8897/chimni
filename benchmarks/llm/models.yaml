# Models for the Chimni LLM benchmark.
#
# Prices are USD per million tokens and drive --max-cost. CHECK THEM against current Anthropic pricing before a
# real run (they were copied from Anthropic's model table on 2026-10-14). cache_write is the 5-minute cache write
# rate (1.25 x input); cache_read is the cache hit rate.
#
# temperature: leave as null for current Claude models. They reject non-default sampling parameters (Sonnet 5.5 and
# Haiku 5.5 return a 400; Opus 5.5 does not accept them at all), so samples use each model's default sampling.
# effort: null keeps the model's default (Opus 5.5 and Haiku 5.5: medium; Sonnet 5.5: high). Set it to make
# models comparable at one level; whatever is used is recorded in the results.

defaults:
  samples: 5          # independent samples per (task, condition, model)
  max_tokens: 16000   # per reply; thinking tokens count against it
  repair_attempts: 2  # extra attempts after a failure, with the error fed back

models:
  - name: sonnet-5.5
    provider: anthropic
    id: claude-sonnet-5-5
    enabled: true
    temperature: null
    effort: null
    price: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}

  - name: haiku-5.5
    provider: anthropic
    id: claude-haiku-5-5
    enabled: true
    temperature: null
    effort: null
    price: {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01}

  - name: opus-5.5
    provider: anthropic
    id: claude-opus-5-5
    enabled: false      # about 2x Sonnet's cost; enable it with --models opus-5.5 or set true
    temperature: null
    effort: null
    price: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}

  # Used only by --dry-run. Priced like Sonnet so the --max-cost path is exercised.
  - name: mock
    provider: mock
    id: mock
    dry_run: true
    price: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
